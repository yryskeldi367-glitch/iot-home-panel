name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: rel-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Archive build
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "home-panel-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: rel-windows-zip
          path: home-panel-windows.zip

  publish:
    name: Publish to GitHub Releases
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rel-android-apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: rel-windows-zip
          path: dist
      - name: Rename APK
        run: |
          mv dist/app-release.apk dist/iot-home-panel-android.apk
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/iot-home-panel-android.apk
            dist/home-panel-windows.zip
          generate_release_notes: true
